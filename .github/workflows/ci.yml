name: CI
on: [push, pull_request]
jobs:
  shell:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - name: Shell syntax
        shell: bash
        run: |
          while IFS= read -r -d '' script; do
            bash -n "$script"
          done < <(find install.sh uninstall.sh bin scripts -type f \( -name '*.sh' -o -path 'bin/*' \) -print0)
      - name: ShellCheck
        shell: bash
        run: |
          if command -v shellcheck >/dev/null; then
            while IFS= read -r -d '' script; do
              shellcheck -S warning "$script"
            done < <(find install.sh uninstall.sh bin scripts -type f \( -name '*.sh' -o -path 'bin/*' \) -print0)
          else
            echo "shellcheck is not available on this runner; bash syntax was checked."
          fi
  test:
    name: ${{ matrix.os }} / Python ${{ matrix.python }}
    runs-on: ${{ matrix.os }}
    env:
      PYTHONPATH: .
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
        python: ["3.10", "3.11", "3.12", "3.13"]
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: ${{ matrix.python }}
      - name: Install test dependencies
        run: python -m pip install --requirement requirements-dev.txt
      - name: Python compile
        # bash expands the glob; PowerShell (the Windows default) passes it
        # on literally and py_compile then fails on a file named "*.py".
        shell: bash
        run: python -m py_compile quassel/*.py
      - name: Offline test suite
        # CoreAudio output-unit tests need a real audio device and are not
        # hermetic. The remaining test files use fakes or opt in explicitly
        # before touching hardware, clipboard, or network.
        run: python -m pytest -q tests --ignore=tests/test_coreaudio_mac.py
