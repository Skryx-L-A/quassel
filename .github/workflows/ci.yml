name: CI
on: [push, pull_request]
jobs:
  shell:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - name: Shell syntax
        shell: bash
        run: |
          while IFS= read -r -d '' script; do
            bash -n "$script"
          done < <(find install.sh uninstall.sh bin scripts -type f \( -name '*.sh' -o -path 'bin/*' \) -print0)
      - name: ShellCheck
        shell: bash
        run: |
          if command -v shellcheck >/dev/null; then
            while IFS= read -r -d '' script; do
              shellcheck -S warning "$script"
            done < <(find install.sh uninstall.sh bin scripts -type f \( -name '*.sh' -o -path 'bin/*' \) -print0)
          else
            echo "shellcheck is not available on this runner; bash syntax was checked."
          fi
  test:
    name: ${{ matrix.os }} / Python ${{ matrix.python }}
    runs-on: ${{ matrix.os }}
    # The Windows suite has not run on a real runner yet. Until its first green
    # run its jobs report without failing the workflow; then this line goes.
    continue-on-error: ${{ matrix.os == 'windows-latest' }}
    env:
      PYTHONPATH: .
      # Qt draws into memory: the tests never need a window, and ubuntu-latest
      # has no display at all.
      QT_QPA_PLATFORM: offscreen
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
        python: ["3.10", "3.11", "3.12", "3.13"]
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: ${{ matrix.python }}
      - name: Install system libraries (Linux)
        # The sounddevice wheel bundles PortAudio only for macOS and Windows.
        # tests/test_win_app.py and test_win_audio.py import it at collection
        # time; without the library the whole run stops with a collection error.
        # PySide6 needs EGL, OpenGL, xkbcommon, fontconfig and D-Bus even for
        # the offscreen platform; ubuntu-latest has none of the first three.
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y libportaudio2 libegl1 libgl1 libxkbcommon0 \
            libfontconfig1 libdbus-1-3
      - name: Point Qt at the system fonts (Windows)
        # The offscreen platform reads fonts with FreeType from one folder
        # instead of asking Windows. Without it every text is measured with an
        # empty font (diagnostic run 38599301167), and test_center_beta sees
        # pages wider than they are.
        if: runner.os == 'Windows'
        shell: bash
        run: echo 'QT_QPA_FONTDIR=C:\Windows\Fonts' >> "$GITHUB_ENV"
      - name: Install test dependencies
        run: python -m pip install --requirement requirements-dev.txt
      - name: Python compile
        # bash expands the glob; PowerShell (the Windows default) passes it
        # on literally and py_compile then fails on a file named "*.py".
        shell: bash
        run: python -m py_compile quassel/*.py
      - name: Offline test suite
        # CoreAudio output-unit tests need a real audio device and are not
        # hermetic. The remaining test files use fakes or opt in explicitly
        # before touching hardware, clipboard, or network.
        run: python -m pytest -q tests --ignore=tests/test_coreaudio_mac.py
