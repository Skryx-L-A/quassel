[project]
name = "quassel-voice"
version = "2.8.0"
description = "Local, private voice typing"
license = "GPL-3.0-or-later"
requires-python = ">=3.10"
dependencies = [
    "PySide6==6.11.1",
    "numpy==2.5.1 ; python_version >= '3.12'",
    "numpy==2.2.6 ; python_version < '3.12'",
    "sounddevice==0.5.5",
    "PyObjC==12.2.1 ; sys_platform == 'darwin'",
    "comtypes==1.4.16 ; sys_platform == 'win32'",
    "pycaw==20251023 ; sys_platform == 'win32'",
    "winrt-Windows.Foundation==3.2.1 ; sys_platform == 'win32'",
    "winrt-Windows.Media.Control==3.2.1 ; sys_platform == 'win32'",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
